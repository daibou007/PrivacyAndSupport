<style>
  :root {
    --bg: #0b0e1a;
    --bg2: #12162a;
    --ink: #eef1ff;
    --muted: #8b91b5;
    --rule: #2a3050;
    --accent: #7c5cff;

    /* Win98 弹窗组件配色 */
    --win-face: #d4d0c8;
    --win-shadow: #808080;
    --win-dark: #404040;
    --win-light: #ffffff;
    --win-title-a: #000080;
    --win-title-b: #1084d0;
    --win-ink: #1a1a1a;
    --danger: #d24726;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(2px 2px at 12% 22%, rgba(255,255,255,.7) 50%, transparent 51%),
      radial-gradient(2px 2px at 68% 12%, rgba(255,255,255,.5) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 84% 38%, rgba(255,255,255,.6) 50%, transparent 51%),
      radial-gradient(2px 2px at 32% 72%, rgba(255,255,255,.45) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 56% 54%, rgba(255,255,255,.5) 50%, transparent 51%),
      radial-gradient(2px 2px at 88% 82%, rgba(255,255,255,.55) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 8% 88%, rgba(255,255,255,.4) 50%, transparent 51%),
      radial-gradient(1200px 700px at 70% -10%, rgba(124,92,255,.22), transparent 60%),
      radial-gradient(900px 600px at 10% 110%, rgba(0,224,198,.14), transparent 60%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    background-attachment: fixed;
    overflow-x: hidden;
    min-height: 100%;
  }

  /* ============ 主界面 ============ */
  #mainUI {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 48px 20px 80px;
    gap: 18px;
  }

  .logo {
    font-size: 64px;
    line-height: 1;
    filter: drop-shadow(0 0 24px rgba(124,92,255,.8));
    animation: float 3.2s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    50% { transform: translateY(-12px) rotate(4deg); }
  }

  h1.title {
    font-size: clamp(32px, 6vw, 56px);
    font-weight: 800;
    letter-spacing: .04em;
    background: linear-gradient(92deg, var(--accent) 0%, var(--accent2) 55%, var(--accent) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 42px rgba(124,92,255,.35);
  }

  .subtitle {
    color: var(--muted);
    font-size: 14px;
    letter-spacing: .12em;
  }

  .big-btn {
    margin-top: 14px;
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    padding: 18px 44px;
    border: 2px solid rgba(255,255,255,.25);
    border-radius: 999px;
    cursor: pointer;
    background: linear-gradient(135deg, var(--accent), #5b3ff0 60%, var(--accent2));
    box-shadow: 0 10px 34px rgba(124,92,255,.45), inset 0 1px 0 rgba(255,255,255,.35);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .big-btn:hover { transform: translateY(-3px) scale(1.03) rotate(-1deg); box-shadow: 0 16px 44px rgba(124,92,255,.6), inset 0 1px 0 rgba(255,255,255,.35); }
  .big-btn:active { transform: translateY(1px) scale(.98); }
  .big-btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }

  .hint { color: var(--muted); font-size: 12.5px; }

  /* 历史记录 */
  #history {
    margin-top: 26px;
    width: min(680px, 100%);
    background: rgba(255,255,255,.04);
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 18px 20px;
    text-align: left;
    backdrop-filter: blur(6px);
  }
  #history[hidden] { display: none; }
  #history h2 {
    font-size: 14px;
    color: var(--accent2);
    letter-spacing: .1em;
    margin-bottom: 10px;
  }
  #historyList { list-style: none; }
  #historyList li {
    padding: 9px 2px;
    border-top: 1px dashed var(--rule);
    font-size: 14px;
    line-height: 1.55;
  }
  #historyList li:first-child { border-top: none; }
  #historyList .tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    color: var(--accent2);
    border: 1px solid var(--accent2);
    border-radius: 999px;
    padding: 1px 8px;
    margin-right: 8px;
    vertical-align: 1px;
  }
  #historyList .his-title { font-weight: 700; }
  #historyList .his-desc { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }

  /* ============ 状态小组件 ============ */
  .chip {
    position: fixed;
    z-index: 100000;
    background: rgba(10,12,24,.72);
    border: 1px solid var(--rule);
    color: var(--ink);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    user-select: none;
  }
  #counter { top: 16px; right: 16px; cursor: default; }
  #counter b { color: var(--accent2); font-size: 15px; }
  #muteBtn { bottom: 16px; right: 16px; }
  #counter, #muteBtn { transition: border-color .2s; }
  #muteBtn:hover { border-color: var(--accent); }

  /* ============ Win98 弹窗 ============ */
  .popup {
    position: fixed;
    width: min(400px, calc(100vw - 28px));
    background: var(--win-face);
    border: 2px solid;
    border-color: var(--win-light) var(--win-dark) var(--win-dark) var(--win-light);
    box-shadow:
      inset 1px 1px 0 var(--win-light),
      inset -1px -1px 0 var(--win-shadow),
      6px 8px 28px rgba(0,0,0,.55);
    transform: rotate(var(--rot, 0deg));
    animation: popIn .22s cubic-bezier(.34,1.56,.64,1) both;
    z-index: 1000; /* 实际层级由 JS 单调递增的 zTop 管理 */
  }
  @keyframes popIn {
    from { transform: scale(.55) rotate(var(--rot, 0deg)); opacity: 0; }
    to   { transform: scale(1) rotate(var(--rot, 0deg)); opacity: 1; }
  }
  .popup.closing {
    animation: popOut .16s ease-in both;
  }
  /* 已被上层覆盖的弹窗：变灰失效但仍留在原地（套娃底座） */
  .popup.stale { pointer-events: none; }
  .popup.stale .titlebar { background: linear-gradient(90deg, #6a6d78, #9aa0ac); }
  .popup.stale .body { opacity: .78; }
  @keyframes popOut {
    from { transform: scale(1) rotate(var(--rot, 0deg)); opacity: 1; }
    to   { transform: scale(.6) rotate(var(--rot, 0deg)); opacity: 0; }
  }

  .popup .titlebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: linear-gradient(90deg, var(--win-title-a), var(--win-title-b));
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    padding: 4px 4px 4px 8px;
    cursor: move;
    user-select: none;
    touch-action: none;
  }
  .popup .titlebar .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 1px 1px 0 rgba(0,0,0,.4); }
  .popup .titlebar .x {
    flex: none;
    width: 20px; height: 18px;
    font-size: 12px; line-height: 15px;
    text-align: center;
    color: var(--win-ink);
    background: var(--win-face);
    border: 2px solid;
    border-color: var(--win-light) var(--win-dark) var(--win-dark) var(--win-light);
    cursor: pointer;
    font-family: sans-serif;
  }
  .popup .titlebar .x:active { border-color: var(--win-dark) var(--win-light) var(--win-light) var(--win-dark); }

  .popup .body { padding: 16px 16px 14px; color: var(--win-ink); }

  .popup .msg {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    font-size: 14px;
    line-height: 1.65;
  }
  .popup .msg .ico { font-size: 30px; line-height: 1.15; flex: none; }

  .popup .btns {
    display: flex;
    justify-content: flex-end;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 16px;
  }

  .btn98 {
    font-family: inherit;
    font-size: 13px;
    color: var(--win-ink);
    background: var(--win-face);
    padding: 5px 16px;
    min-width: 76px;
    border: 2px solid;
    border-color: var(--win-light) var(--win-dark) var(--win-dark) var(--win-light);
    box-shadow: inset 1px 1px 0 var(--win-light), inset -1px -1px 0 var(--win-shadow);
    cursor: pointer;
  }
  .btn98:active { border-color: var(--win-dark) var(--win-light) var(--win-light) var(--win-dark); box-shadow: none; padding: 6px 15px 4px 17px; }
  .btn98.primary { outline: 1.5px dotted #333; outline-offset: -5px; }

  .btn98.runaway { transition: transform .12s ease; }

  /* 进度条 */
  .pbar {
    height: 18px;
    border: 2px solid;
    border-color: var(--win-shadow) var(--win-light) var(--win-light) var(--win-shadow);
    background: var(--win-face);
    padding: 2px;
    margin-top: 12px;
  }
  .pbar .fill {
    height: 100%;
    width: 0%;
    background: repeating-linear-gradient(90deg,
      var(--win-title-a) 0 8px, var(--win-title-b) 8px 12px);
    transition: width .25s ease;
  }

  /* 结果卡片 */
  .result-card {
    border: 2px solid;
    border-color: var(--win-shadow) var(--win-light) var(--win-light) var(--win-shadow);
    padding: 12px 12px 10px;
    background: #eae6de;
  }
  .result-card .tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    background: var(--win-title-a);
    padding: 2px 9px;
    border-radius: 999px;
    margin-bottom: 8px;
  }
  .result-card h3 {
    font-size: 17px;
    line-height: 1.5;
    margin-bottom: 8px;
  }
  .result-card .desc { font-size: 13.5px; line-height: 1.7; color: #3c3c3c; }
  .result-stats {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px dashed var(--win-shadow);
    font-size: 12px;
    color: #3c3c3c;
  }
  .result-stats b { color: var(--win-title-a); }
  .result-source { margin-top: 8px; font-size: 11px; color: #6a6a6a; }

  /* 提示 toast */
  #toast {
    position: fixed;
    left: 50%;
    bottom: 64px;
    transform: translateX(-50%) translateY(16px);
    z-index: 100001;
    background: rgba(10,12,24,.9);
    border: 1px solid var(--accent2);
    color: var(--accent2);
    font-size: 13px;
    padding: 8px 18px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ============ 特效层 ============ */
  /* CRT 扫描线（覆盖全屏，含弹窗，营造复古质感） */
  #scanlines {
    position: fixed; inset: 0; pointer-events: none; z-index: 99990;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 1px, transparent 1px 3px);
  }
  /* 结果揭晓白闪 */
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 99995; }

  /* 闪烁星星 & 漂浮 emoji：位于内容之下、星空背景之上 */
  .star, .float-emoji { position: fixed; pointer-events: none; z-index: -1; }
  .star { border-radius: 50%; background: #fff; animation: twinkle var(--d, 3s) ease-in-out infinite; }
  @keyframes twinkle {
    0%, 100% { opacity: .12; transform: scale(.8); }
    50% { opacity: .95; transform: scale(1.25); }
  }
  .float-emoji { bottom: -70px; opacity: 0; animation: floatUp var(--t, 12s) linear forwards; }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    10%  { opacity: var(--o, .4); }
    85%  { opacity: var(--o, .4); }
    100% { transform: translateY(-112vh) rotate(var(--r, 60deg)); opacity: 0; }
  }

  /* 彩带粒子 */
  .confetti { position: fixed; width: 8px; height: 14px; border-radius: 2px; pointer-events: none; z-index: 99996; }

  /* 警告弹窗抖动（用 margin 偏移，避免覆盖 rotate transform） */
  .popup.shake { animation: popIn .22s cubic-bezier(.34,1.56,.64,1) both, shakeX .4s .24s ease-in-out; }
  @keyframes shakeX {
    0%, 100% { margin-left: 0; }
    20% { margin-left: -8px; } 40% { margin-left: 7px; }
    60% { margin-left: -5px; } 80% { margin-left: 3px; }
  }

  /* 「关闭全部」时全屏震动 */
  body.shaking { animation: screenShake .45s ease-in-out; }
  @keyframes screenShake {
    0%, 100% { transform: translate(0, 0); }
    15% { transform: translate(-9px, 5px); } 30% { transform: translate(8px, -6px); }
    45% { transform: translate(-6px, 4px); } 60% { transform: translate(5px, -3px); }
    75% { transform: translate(-3px, 2px); }
  }

  /* 标题故障（glitch）闪烁 */
  h1.title { position: relative; }
  h1.title::before, h1.title::after {
    content: attr(data-text);
    position: absolute; left: 0; top: 0; width: 100%;
    opacity: 0; pointer-events: none;
  }
  h1.title::before { color: var(--accent2); -webkit-text-fill-color: var(--accent2); animation: glitchA 5s infinite; }
  h1.title::after  { color: var(--accent);  -webkit-text-fill-color: var(--accent);  animation: glitchB 5s infinite; }
  @keyframes glitchA {
    0%, 86%, 90.5%, 100% { opacity: 0; transform: none; clip-path: inset(0 0 0 0); }
    87%   { opacity: .8; transform: translate(-5px, -2px); clip-path: inset(12% 0 55% 0); }
    88.5% { opacity: .8; transform: translate(5px, 1px);  clip-path: inset(60% 0 8% 0); }
  }
  @keyframes glitchB {
    0%, 88%, 92.5%, 100% { opacity: 0; transform: none; clip-path: inset(0 0 0 0); }
    89%   { opacity: .8; transform: translate(5px, 2px);  clip-path: inset(38% 0 30% 0); }
    90.5% { opacity: .8; transform: translate(-4px, -1px); clip-path: inset(5% 0 72% 0); }
  }

  /* 主按钮呼吸光晕 */
  .big-btn { animation: btnPulse 2.8s ease-in-out infinite; }
  .big-btn:disabled { animation: none; }
  @keyframes btnPulse {
    0%, 100% { box-shadow: 0 10px 34px rgba(124,92,255,.45), inset 0 1px 0 rgba(255,255,255,.35); }
    50% { box-shadow: 0 10px 48px rgba(0,224,198,.55), inset 0 1px 0 rgba(255,255,255,.35); }
  }

  /* 结果卡片流光扫过 */
  .result-card { position: relative; overflow: hidden; }
  .result-card::after {
    content: ""; position: absolute; top: -60%; left: 0; width: 45%; height: 220%;
    transform: translateX(-160%) rotate(22deg);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent);
    animation: shine 2.8s ease-in-out infinite;
  }
  @keyframes shine {
    0%, 55% { transform: translateX(-160%) rotate(22deg); }
    100% { transform: translateX(420%) rotate(22deg); }
  }

  /* 进度 99% 卡住时红字闪烁 */
  .stuck { color: #c62828; font-weight: 700; animation: blink .55s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .2; } }

  /* 套娃深度数字跳动 */
  #counter b { display: inline-block; }
  #counter b.pop { animation: numPop .3s ease-out; }
  @keyframes numPop { 50% { transform: scale(1.7); color: var(--accent); } }

  /* ============ 战斗舞台 ============ */
  #battleStage { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: 10px; width: min(640px, 100%); }
  #battleStage[hidden] { display: none; }
  .alarm-bar {
    font-size: 13px; letter-spacing: .15em; color: #ff8a8a;
    border: 1px solid rgba(255,90,90,.4); background: rgba(255,60,60,.08);
    padding: 6px 16px; border-radius: 999px;
    animation: blink 1.4s steps(2) infinite;
  }
  .ufo-zone { position: relative; display: flex; justify-content: center; width: 100%; min-height: 180px; }
  .ufo-wrap { position: relative; display: flex; flex-direction: column; align-items: center; will-change: transform; }
  .ufo-wrap.damaged { rotate: -4deg; }
  .ufo-wrap.damaged .ufo { filter: drop-shadow(0 10px 22px rgba(255,80,60,.5)) saturate(.85) brightness(.9); }
  .ufo-smoke {
    position: absolute; top: -4px; left: 56%; font-size: 26px;
    pointer-events: none; opacity: 0;
    animation: smokeRise 1.8s ease-out infinite;
  }
  @keyframes smokeRise {
    0% { transform: translate(0, 0) scale(.7); opacity: 0; }
    20% { opacity: .95; }
    100% { transform: translate(16px, -48px) scale(1.5); opacity: 0; }
  }
  .ufo-wrap.hit { animation: ufoHit .55s ease-out; }
  .ufo-wrap.dodge { animation: ufoDodge .5s ease-in-out; }
  .ufo {
    font-size: 84px; line-height: 1; position: relative; z-index: 2;
    animation: ufoBob 2.6s ease-in-out infinite;
    filter: drop-shadow(0 10px 22px rgba(0,224,198,.35));
  }
  .beam {
    width: 110px; height: 64px; margin-top: -14px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, rgba(0,224,198,.4), rgba(0,224,198,0));
    clip-path: polygon(38% 0, 62% 0, 100% 100%, 0 100%);
    animation: beamPulse 2s ease-in-out infinite;
  }
  .alien-face { font-size: 30px; animation: alienSway 2.2s ease-in-out infinite; }
  @keyframes ufoBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes beamPulse { 0%, 100% { opacity: .7; } 50% { opacity: 1; } }
  @keyframes alienSway { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
  @keyframes ufoHit {
    0% { transform: translate(0, 0); filter: none; }
    15% { transform: translate(-12px, 10px); filter: brightness(2.2) saturate(3) hue-rotate(-30deg); }
    35% { transform: translate(10px, -5px); filter: brightness(1.8); }
    55% { transform: translate(-7px, 6px); }
    75% { transform: translate(4px, -2px); }
    100% { transform: translate(0, 0); filter: none; }
  }
  @keyframes ufoDodge {
    0% { transform: translateX(0); }
    35% { transform: translateX(110px) rotate(8deg); }
    60% { transform: translateX(88px) rotate(5deg); }
    100% { transform: translateX(0) rotate(0); }
  }
  .taunt { color: var(--muted); font-size: 14px; min-height: 22px; text-align: center; }

  .repel-box {
    width: min(520px, 100%);
    background: rgba(255,255,255,.04);
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 14px 16px;
    backdrop-filter: blur(6px);
  }
  .repel-label { font-size: 12.5px; letter-spacing: .12em; color: var(--accent2); margin-bottom: 8px; }
  .pbar.big { height: 24px; border: 2px solid; border-color: var(--win-shadow) var(--win-light) var(--win-light) var(--win-shadow); padding: 3px; margin: 0; }
  .fill.charge {
    width: 99%;
    background: repeating-linear-gradient(90deg, #2bd62b 0 8px, #1c9c1c 8px 12px);
    background-size: 20px 100%;
    animation: chargeMove .7s linear infinite;
  }
  @keyframes chargeMove { to { background-position: 20px 0; } }
  .repel-num { margin-top: 8px; font-size: 13.5px; color: var(--ink); }
  .repel-num b { color: #2bd62b; font-size: 16px; }
  #repelDiff { color: var(--muted); font-size: 12px; margin-left: 8px; }

  .shot {
    position: fixed; font-size: 34px; z-index: 99950; pointer-events: none;
    filter: drop-shadow(0 0 12px rgba(124,92,255,.95)); will-change: transform;
  }
  .dmg {
    position: fixed; z-index: 99951; pointer-events: none;
    font-weight: 800; font-size: 24px; color: var(--accent2);
    text-shadow: 0 0 14px rgba(0,224,198,.9);
  }
  body.battle-on::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1;
    background: radial-gradient(85% 45% at 50% 0%, rgba(255,64,64,.16), transparent 70%);
    animation: alarmPulse 1.6s ease-in-out infinite;
  }
  @keyframes alarmPulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }

  .judge-ok { color: #1a7f37; }
  .judge-bad { color: #c62828; }

  /* ============ 攻击特效 ============ */
  /* 爆炸光环 */
  .boom-ring {
    position: fixed; z-index: 99949; pointer-events: none;
    width: 20px; height: 20px; border-radius: 50%;
    border: 4px solid rgba(255,220,120,.95);
    box-shadow: 0 0 26px rgba(255,180,60,.85);
  }
  .boom-bit { position: fixed; z-index: 99949; pointer-events: none; font-size: 20px; }

  /* 攻击效果速报卡 */
  .impact-card {
    position: fixed; z-index: 99952; pointer-events: none;

<script>
(function () {
  "use strict";

  var $ = function (s) { return document.querySelector(s); };
  var layer = document.body;
  var bigBtn = $("#bigBtn");
  var attackBtn = $("#attackBtn");
  var depthNum = $("#depthNum");
  var muteBtn = $("#muteBtn");
  var toastEl = $("#toast");

  var openCount = 0;   // 当前打开的弹窗数（用于级联偏移与深度显示）
  var running = false; // 是否正在生成流程中
  var muted = false;
  var audioCtx = null;

  /* ---------------- 音效（WebAudio 合成，无外部资源） ---------------- */
  function ctx() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    return audioCtx;
  }
  function beep(freq, dur, type, vol, delay) {
    if (muted) return;
    var c = ctx();
    if (!c) return;
    if (c.state === "suspended") c.resume();
    var t0 = c.currentTime + (delay || 0);
    var o = c.createOscillator();
    var g = c.createGain();
    o.type = type || "square";
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.035, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + (dur || 0.08));
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + (dur || 0.08) + 0.02);
  }
  function sweep(f1, f2, dur, type, vol) {
    if (muted) return;
    var c = ctx();
    if (!c) return;
    if (c.state === "suspended") c.resume();
    var t0 = c.currentTime;
    var o = c.createOscillator();
    var g = c.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(f1, t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f2), t0 + dur);
    g.gain.setValueAtTime(vol || 0.04, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  var sfx = {
    open:   function () { beep(520, .06); beep(760, .07, "square", .03, .05); },
    warn:   function () { beep(196, .12, "sawtooth", .05); beep(196, .12, "sawtooth", .05, .16); },
    click:  function () { beep(880, .05, "square", .03); },
    deny:   function () { beep(160, .2, "sawtooth", .05); },
    result: function () { [523, 659, 784, 1047].forEach(function (f, i) { beep(f, .12, "triangle", .05, i * .09); }); },
    closeAll: function () { [784, 523, 392].forEach(function (f, i) { beep(f, .08, "square", .03, i * .06); }); },
    zap:    function () { sweep(1200, 180, .3, "sawtooth", .045); },
    boom:   function () { beep(90, .3, "sawtooth", .09); beep(60, .45, "square", .06, .03); beep(140, .2, "square", .05, .1); },
    whiff:  function () { sweep(600, 1500, .16, "sine", .03); beep(220, .18, "sine", .03, .18); }
  };
  muteBtn.addEventListener("click", function () {
    muted = !muted;
    muteBtn.textContent = muted ? "🔇" : "🔊";
    if (!muted) sfx.click();
  });

  /* ---------------- 工具 ---------------- */
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 1800);
  }

  function updateDepth() {
    depthNum.textContent = openCount;
    depthNum.classList.remove("pop");
    void depthNum.offsetWidth;
    depthNum.classList.add("pop");
  }

  /* ---------------- 图层管理：单调递增 z-index，杜绝新弹窗被旧弹窗遮挡 ---------------- */
  var zTop = 1000;
  function bringToFront(el) {
    zTop += 1;
    el.style.zIndex = String(zTop);
  }

  /* ---------------- 视觉特效 ---------------- */
  var CONF_COLORS = ["#7c5cff", "#00e0c6", "#ffd93d", "#ff6b9d", "#4ecdc4", "#eae6de"];

  function spawnConfetto(x, y) {
    var p = document.createElement("div");
    p.className = "confetti";
    p.style.background = pick(CONF_COLORS);
    p.style.left = x + "px";
    p.style.top = y + "px";
    document.body.appendChild(p);
    var ang = Math.random() * Math.PI * 2;
    var dist = 70 + Math.random() * 230;
    var dx = Math.cos(ang) * dist;
    var dy = Math.abs(Math.sin(ang)) * dist * 0.35 + 150 + Math.random() * 220;
    var rot = randInt(-560, 560);
    var anim = p.animate([
      { transform: "translate(0,0) rotate(0deg)", opacity: 1 },
      { transform: "translate(" + dx.toFixed(0) + "px," + dy.toFixed(0) + "px) rotate(" + rot + "deg)", opacity: 0 }
    ], { duration: 900 + Math.random() * 800, easing: "cubic-bezier(.16,.6,.45,1)" });
    anim.onfinish = function () { p.remove(); };
  }
  function confettiBurst(x, y) {
    for (var i = 0; i < 56; i++) spawnConfetto(x, y);
  }

  function screenFlash() {
    var f = $("#flash");
    f.style.transition = "none";
    f.style.opacity = "0.7";
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        f.style.transition = "opacity .5s ease-out";
        f.style.opacity = "0";
      });
    });
  }

  function typewrite(el, text) {
    if (!el) return;
    el.textContent = "";
    var i = 0;
    var t = setInterval(function () {
      i++;
      el.textContent = text.slice(0, i);
      if (i >= text.length) clearInterval(t);
    }, 42);
  }

  function spawnStars() {
    for (var i = 0; i < 44; i++) {
      var s = document.createElement("div");
      s.className = "star";
      var size = (Math.random() * 2.2 + 1).toFixed(1);
      s.style.width = size + "px";
      s.style.height = size + "px";
      s.style.left = (Math.random() * 100).toFixed(2) + "vw";
      s.style.top = (Math.random() * 100).toFixed(2) + "vh";
      s.style.setProperty("--d", (2 + Math.random() * 3.5).toFixed(2) + "s");
      s.style.animationDelay = (Math.random() * 4).toFixed(2) + "s";
      document.body.appendChild(s);
    }
  }

  var FLOAT_EMOJIS = ["🧠", "✨", "💫", "🛸", "💡", "🌌", "⭐", "🚀", "🔭"];
  function spawnFloatEmoji() {
    if (document.querySelectorAll(".float-emoji").length >= 9) return;
    var e = document.createElement("div");
    e.className = "float-emoji";
    e.textContent = pick(FLOAT_EMOJIS);
    e.style.left = randInt(2, 94) + "vw";
    e.style.fontSize = randInt(15, 34) + "px";
    e.style.setProperty("--t", randInt(9, 16) + "s");
    e.style.setProperty("--o", (0.22 + Math.random() * 0.34).toFixed(2));
    e.style.setProperty("--r", randInt(-140, 140) + "deg");
    document.body.appendChild(e);
    e.addEventListener("animationend", function () { e.remove(); });
  }

  /* ---------------- 通用弹窗 ----------------
     opts: { title, icon, text, html, width, buttons:[{label, value, primary, runaway}], onOpen }
     返回 Promise，resolve 为被点击按钮的 value（或 'close'） */
  function openPopup(opts) {
    return new Promise(function (resolve) {
      openCount++;
      updateDepth();
      sfx[opts.sound || "open"]();

      var cascade = openCount - 1;
      var w = opts.width || 400;
      var maxX = Math.max(0, window.innerWidth - w - 16);
      var x = Math.min(maxX, Math.max(8, window.innerWidth / 2 - w / 2 + (cascade % 7) * 34 - 80));
      var y = Math.min(window.innerHeight - 200, Math.max(8, window.innerHeight / 2 - 150 + (cascade % 7) * 30 - 70));

      var el = document.createElement("div");
      el.className = "popup";
      el.style.left = x + "px";
      el.style.top = y + "px";
      el.style.setProperty("--rot", (Math.random() * 2.4 - 1.2).toFixed(2) + "deg");
      if (opts.width) el.style.width = "min(" + opts.width + "px, calc(100vw - 28px))";

      var tb = document.createElement("div");
      tb.className = "titlebar";
      var t = document.createElement("span");
      t.className = "t";
      t.textContent = opts.title || "系统消息";
      var xbtn = document.createElement("span");
      xbtn.className = "x";
      xbtn.textContent = "✕";
      xbtn.title = "关闭";
      tb.appendChild(t);
      tb.appendChild(xbtn);

      var body = document.createElement("div");
      body.className = "body";

      if (opts.text) {
        var msg = document.createElement("div");
        msg.className = "msg";
        var ico = document.createElement("span");
        ico.className = "ico";
        ico.textContent = opts.icon || "ℹ️";
        var p = document.createElement("span");
        p.textContent = opts.text;
        msg.appendChild(ico);
        msg.appendChild(p);
        body.appendChild(msg);
      }
      if (opts.html) body.appendChild(opts.html);

      var btnsWrap = null;
      if (opts.buttons && opts.buttons.length) {
        btnsWrap = document.createElement("div");
        btnsWrap.className = "btns";
        opts.buttons.forEach(function (b) {
          var btn = document.createElement("button");
          btn.className = "btn98" + (b.primary ? " primary" : "") + (b.runaway ? " runaway" : "");
          btn.textContent = b.label;

          if (b.runaway) {
            var dodges = 0;
            btn.addEventListener("pointerenter", function () {
              if (dodges >= 3) return;
              dodges++;
              var dx = randInt(-90, 90), dy = randInt(-46, 46);
              btn.style.transform = "translate(" + dx + "px," + dy + "px)";
              sfx.deny();
              if (dodges === 3) setTimeout(function () { toast("它跑累了，你赢了。"); }, 300);
            });
          }
          btn.addEventListener("click", function () {
            sfx.click();
            finish(b.value);
          });
          btnsWrap.appendChild(btn);
        });
        body.appendChild(btnsWrap);
      }

      el.appendChild(tb);
      el.appendChild(body);
      layer.appendChild(el);
      bringToFront(el);
      if (opts.sound === "warn") el.classList.add("shake");

      var closed = false;
      function finish(value, shouldClose) {
        if (closed) return;
        closed = true;
        if (opts.keepOpen && !shouldClose) {
          /* 套娃：弹窗不关闭，变灰后留在原地当底座 */
          el.classList.add("stale");
        } else {
          openCount = Math.max(0, openCount - 1);
          updateDepth();
          el.classList.add("closing");
          setTimeout(function () { el.remove(); }, 170);
        }
        resolve(value || "close");
      }

      xbtn.addEventListener("click", function () { sfx.click(); finish("close", true); });

      /* 标题栏拖拽 */
      var dragging = false, ox = 0, oy = 0;
      tb.addEventListener("pointerdown", function (e) {
        if (e.target === xbtn) return;
        dragging = true;
        var rect = el.getBoundingClientRect();
        ox = e.clientX - rect.left;
        oy = e.clientY - rect.top;
        bringToFront(el);
        try { tb.setPointerCapture(e.pointerId); } catch (_) {}
        e.preventDefault();
      });
      tb.addEventListener("pointermove", function (e) {
        if (!dragging) return;
        var nx = e.clientX - ox, ny = e.clientY - oy;
        el.style.left = Math.max(-40, nx) + "px";
        el.style.top = Math.max(-8, ny) + "px";
      });
      tb.addEventListener("pointerup", function () { dragging = false; });
      tb.addEventListener("pointercancel", function () { dragging = false; });

      if (opts.onOpen) opts.onOpen(body);
    });
  }

  /* ---------------- 脑洞语料 ---------------- */
  var subjects = [
    "一只会编程的猫", "一台特别怀旧的旧手机", "一个不想上班的外星人", "太阳系最后一杯奶茶",
    "一位会魔法的程序员", "一只退休的导盲犬", "一株会走路的仙人掌", "凌晨三点的洗衣机",
    "一个来自2077年的外卖员", "Wi-Fi 信号本体", "一颗有起床气的行星", "一只学会了游泳的鸡",
    "一台罢工中的打印机", " 月球背面的便利店店长", "一条坚持健身的锦鲤", "一本写日记的字典"
  ];
  var settings = [
    "开了一家深夜食堂", "报名了脱口秀大赛", "偷偷接管了地球", "决定徒步环游宇宙",
    "发起了史上第一次罢工", "在月球上开了民宿", "意外成了全宇宙网红", "收藏了整个太平洋",
    "给自己写了一本传记", "和月亮签了独家的合同", "举办了一场大型相亲会", "承包了银河系全部快递",
    "开了一所教摸鱼的学校", "竞选了太阳系学生会主席", "兼职当了天气预报员", "开了一家时间当铺"
  ];
  var twists = [
    "结果发现账单比宇宙还大", "但第二天就忘了自己为什么出发", "直到它遇到一台更懒的机器人",
    "然而宇宙规定：必须先交作业", "意外地拯救了人类的每个周一", "结果引来全银河系的一星差评",
    "却在最后一秒选择了躺平", "因此顺手发明了新的物理学", "从此周二变成了付费订阅制",
    "还顺便倒卖时间旅行返程票", "最后被查出数学是体育老师教的", "于是宇宙管理员连夜打了补丁"
  ];
  var tags = ["科幻", "童话", "悬疑", "武侠", "末日", "治愈", "赛博朋克", "职场", "恐怖", "无厘头"];
  var sources = [
    "凌晨三点的大脑缓存", "午睡时的平行宇宙", "地铁上陌生人的半句话", "食堂阿姨的手抖瞬间",
    "过期酸奶的灵光一现", "Wi-Fi 断网时的怨念", "昨夜梦里的临时工", "被窝里的秘密研究所"
  ];

  function makeIdea() {
    var s = pick(subjects), st = pick(settings), t = pick(twists), tag = pick(tags);
    var energy = randInt(1, 5);
    var stars = "★★★★★".slice(0, energy) + "☆☆☆☆☆".slice(0, 5 - energy);
    return {
      tag: tag,
      title: "如果" + s + st,
      desc: t + "。",
      energy: energy,
      stars: stars,
      cred: -randInt(5, 99),
      size: (Math.random() * 8 + 0.5).toFixed(1),
      source: pick(sources),
      text: "【" + tag + "脑洞】如果" + s + st + "——" + t + "。（能量" + stars + "｜可信度-" + randInt(5, 99) + "%）"
    };
  }

  /* ---------------- 流程步骤 ---------------- */
  var gatePool = [
    function () {
      return openPopup({
        title: "脑洞雷达.exe", icon: "📡", sound: "open", keepOpen: true,
        text: "检测到前方 3 光年处有强脑洞能量波动，请系好想象力，扶稳好奇心。",
        buttons: [{ label: "系好了", primary: true }]
      });
    },
    function () {
      return openPopup({
        title: "警告", icon: "⚠️", sound: "warn", keepOpen: true,
        text: "该脑洞直径超出常规弹窗承载能力，随时可能发生「弹窗套弹窗」现象。是否继续？",
        buttons: [
          { label: "继续", primary: true },
          { label: "再想想" }
        ]
      }).then(function (v) {
        if (v === "close") return v;
        if (v !== "继续") {
          return openPopup({
            title: "温馨提示", icon: "🙃", keepOpen: true,
            text: "再想想它也不会变小的。宇宙已收到你的犹豫，并决定无视。",
            buttons: [{ label: "好吧", primary: true }]
          });
        }
      });
    },
    function () {
      return openPopup({
        title: "想象力安全协议", icon: "🔒", sound: "warn", keepOpen: true,
        text: "根据《宇宙脑洞管理条例》第 42 条：好奇心过剩者方可通行。请自证。",
        buttons: [{ label: "我好奇心过剩", primary: true }]
      });
    },
    function () {
      return openPopup({
        title: "naodong_sys", icon: "🧠", keepOpen: true,
        text: "系统正在从你的颅骨内抽取想象力，过程可能伴随轻微眩晕感。",
        buttons: [{ label: "抽吧", primary: true }]
      });
    },
    function () {
      return openPopup({
        title: "宇宙支付中心", icon: "💳", sound: "warn", keepOpen: true,
        text: "本次脑洞生成完全免费，仅需支付 0.01 个好奇心作为手续费。",
        buttons: [{ label: "确定", primary: true }]
      });
    }
  ];

  function confirmStep() {
    return openPopup({
      title: "最终确认", icon: "❓", sound: "warn", keepOpen: true,
      text: "真的要打开这个脑洞吗？打开后可能笑出声、写进小说，或半夜兴奋得睡不着。",
      buttons: [
        { label: "打开！", primary: true },
        { label: "不了，谢谢", runaway: true }
      ]
    }).then(function (v) {
      if (v !== "打开！" && v !== "close") {
        return openPopup({
          title: "系统提示", icon: "😏", keepOpen: true,
          text: "犹豫，就会败北。本系统已替你做决定：继续生成。",
          buttons: [{ label: "行吧", primary: true }]
        });
      }
    });
  }

  function maybeRecursion() {
    if (Math.random() > 0.35) return Promise.resolve();
    return openPopup({
      title: "递归警告", icon: "🌀", sound: "warn", keepOpen: true,
      text: "检测到弹窗正在套弹窗。这不是 Bug，这是特性。系统已自动假装没看见。",
      buttons: [{ label: "我知道了", primary: true }]
    });
  }

  function progressStep() {
    return new Promise(function (resolve) {
      var wrap = document.createElement("div");
      wrap.innerHTML =
        '<div class="msg"><span class="ico">⚙️</span><span>脑洞合成中，请稍候…<span class="pct"></span></span></div>' +
        '<div class="pbar"><div class="fill"></div></div>';
      var fill = wrap.querySelector(".fill");
      var pct = wrap.querySelector(".pct");
      var fake = 0;
      var timer = setInterval(function () {
        fake = Math.min(99, fake + randInt(6, 22));
        fill.style.width = fake + "%";
        pct.textContent = " " + fake + "%";
        if (fake >= 99) {
          clearInterval(timer);
          pct.classList.add("stuck");
          pct.textContent = " 99%（卡住了）";
        }
      }, 220);

      openPopup({
        title: "脑洞合成中", width: 440, sound: "open", keepOpen: true,
        text: null, html: wrap,
        buttons: [{ label: "帮它一下", primary: true }],
        onOpen: null
      }).then(function () {

    running = true;
    attackBtn.disabled = true;
    attackBtn.textContent = "⏳ 正在收集脑洞弹药…";

    var gates = gatePool.slice();
    /* 随机选 2~3 道关卡 */
    var count = randInt(2, 3);
    var chosen = [];
    for (var i = 0; i < count; i++) {
      chosen.push(gates.splice(randInt(0, gates.length - 1), 1)[0]);
    }

    var idea = null;
    var chain = Promise.resolve();
    chosen.forEach(function (g) { chain = chain.then(g); });
    chain
      .then(confirmStep)
      .then(maybeRecursion)
      .then(progressStep)
      .then(function () {
        idea = makeIdea();
        addToHistory(idea);
        return resultStep(idea);
      })
      .then(function (v) {
        if (v === "attack") {
          return loadStep(idea).then(function () {
            /* 发射：关闭全部弹窗清出战场，同时全地球反击战报刷屏 */
            closeAll();
            globalVolley(7);
            return fireBrain(idea);
          }).then(function (oc) { return settleStep(idea, oc); });
        }
        return v; /* giveup / close */
      })
      .then(function (v) {
        closeAll();
        resetAttackBtn();
        running = false;
        if (v === "again") {
          var after = battle.repel >= 99.99 ? pddWall() : Promise.resolve();
          after.then(function () { setTimeout(generateAndAttack, 500); });
        }
      });
  }

  spawnStars();
  setInterval(spawnFloatEmoji, 2000);
  setTimeout(spawnFloatEmoji, 300);
  setTimeout(spawnFloatEmoji, 900);

  bigBtn.addEventListener("click", function () {
    if (running || battle.active) return;
    running = true;
    bigBtn.disabled = true;
    bigBtn.textContent = "⏳ 紧急简报接收中…";
    sfx.click();
    storyIntro().then(function () { running = false; });
  });

  attackBtn.addEventListener("click", function () {
    if (!running) sfx.click();
    generateAndAttack();
  });
})();
</script>
</body>
</html>
